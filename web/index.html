<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Helio — школьный помощник по математике на SymPy.">
  <title>Helio — математический помощник</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><span>Helio</span><button class="icon-button close-sidebar" id="closeSidebar" aria-label="Закрыть меню">×</button></div>
      <button class="new-chat" id="newChat"><span>＋</span> Новый чат</button>
      <div class="side-label">НЕДАВНИЕ</div>
      <div class="chat-list" id="chatList"></div>
      <div class="side-bottom"><span class="status-dot"></span><span id="engineStatus">Подключаю SymPy…</span></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Открыть историю">☰</button>
        <div class="mobile-brand"><span class="brand-mark">✦</span> Helio</div>
        <div class="top-controls">
          <label class="select-wrap model-select"><span class="select-icon">✦</span><select id="modelSelect" aria-label="Режим объяснения"><option>Helio Gen 1 Flash</option><option>Helio Gen 1 Pro</option></select><span class="chevron">⌄</span></label>
          <label class="select-wrap grade-select"><select id="gradeSelect" aria-label="Класс"></select><span class="chevron">⌄</span></label>
          <button class="icon-button desktop-new" id="desktopNew" aria-label="Новый чат">＋</button>
        </div>
      </header>
      <section class="conversation" id="conversation" aria-live="polite"></section>
      <form class="composer-wrap" id="composer">
        <div class="suggestions">
          <button type="button" class="suggestion">2214÷(12²+15²)+36</button>
          <button type="button" class="suggestion">Реши 3x + 5 = 20</button>
          <button type="button" class="suggestion">sin 30°</button>
        </div>
        <div class="composer"><textarea id="prompt" rows="1" placeholder="Напиши задачу или сообщение…" aria-label="Сообщение"></textarea><button class="send-button" id="sendButton" aria-label="Отправить">↑</button></div>
        <div class="composer-note">SymPy считает прямо в браузере · первое включение может занять немного времени</div>
      </form>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>

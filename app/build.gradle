plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
def appVersionCode = providers.gradleProperty('appVersionCode').getOrElse('1').toInteger()
def appVersionName = providers.gradleProperty('appVersionName').getOrElse('1.0')
android {
    namespace 'com.aimachine.school'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aimachine.school'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
}
chaquopy {
    defaultConfig {
        pip { install 'sympy==1.14.0' }
    }
}
